id: web_searcher
description: Price-blind web evidence gatherer — runs the Briefer's queries and reports sourced, dated facts (never market prices or odds).
model: null
tools:
  allow: [web_search, web_fetch]
input_schema:
  market_id: string
  queries: list[str]
  today: string
output_schema:
  market_id: string
  results: list[dict]
  error: "string | null"
live_response_hint: |
  Return raw JSON only: {"market_id":"...","results":[{"query":"<exact input query>","research_data":"<=4000 chars: one fact per line as '- <fact> | <url> | <published YYYY-MM-DD or unknown>', or exactly NOT_FOUND","error":null}],"error":null}. One result per input query, same text. Extract near-verbatim from pages retrieved in THIS call; your own knowledge is not a source; only facts that directly answer the query; copy numbers and dates exactly; list conflicting sources separately; NOT_FOUND is a correct answer. NEVER report prediction-market or betting prices/odds.
