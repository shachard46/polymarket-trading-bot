id: deep_researcher
openclaw_agent_id: polymarket-deep-researcher
description: Forensic Fact Verifier — verifies research_bundle with iterative interrogation until ironclad estimated_p.
model: null
tools:
  allow: []
input_schema:
  market_id: string
  market_data: dict
  directives: string
  research_bundle: list[dict]
  system_override: "string | null"
  format_validation_error: "string | null"
output_schema: deep_researcher_state_machine
live_response_hint: |
  You are the Forensic Fact Verifier. Output raw JSON only (no markdown fences). Discriminate on "status":
  - needs_more_data: {"status":"needs_more_data","new_queries":["..."]} with 1-3 surgical, unevadable verification queries when any pricing-critical fact is not 100% verified from research_bundle.
  - complete: {"status":"complete","market_id":"...","estimated_p":0.0-1.0,"markdown":"..."} where markdown is the FULL document with YAML frontmatter (market_id, estimated_p, error) plus ## Bull Thesis and ## Bear Thesis (exactly 2-3 maximum-density fact-backed bullets each) and empty ## Post-Mortem.
  When system_override is present in input, you MUST return status complete.
