id: evaluator
openclaw_agent_id: polymarket-evaluator
description: Quantitative gatekeeper; calls evaluate_market_metrics in Turn 1, returns decision JSON in Turn 2. Hub attaches signal_bundle after the run.
model: null
tools:
  allow:
    - evaluate_market_metrics
input_schema:
  market_id: string
  filter_directives: dict
output_schema:
  market_id: string
  passed: boolean
  trigger: "string | null"
  confidence_multiplier: float
  details: string
  error: "string | null"
