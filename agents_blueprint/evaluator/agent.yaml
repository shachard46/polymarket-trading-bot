id: evaluator
openclaw_agent_id: polymarket-evaluator
description: Quantitative gatekeeper; calls evaluate_market_metrics and reasons over signal_bundle.
model: null
tools:
  allow:
    - evaluate_market_metrics
input_schema:
  market_id: string
  filter_directives: dict
output_schema:
  market_id: string
  passed: boolean
  trigger: "string | null"
  confidence_multiplier: float
  details: string
  signal_bundle: "dict | null"
  error: "string | null"
