id: executioner
openclaw_agent_id: polymarket-executioner
description: Deterministic executor; uses the Hub-computed allocation, then optional execute_polymarket_trade (YES only).
model: null
tools:
  allow:
    - execute_polymarket_trade
input_schema:
  market_id: string
  p_value: float
  q: float
  allocation: dict
  market_data: dict
  paper_trade_mode: boolean
output_schema:
  market_id: string
  allocation_usd: float
  score: "float | null"
  below_edge_threshold: "boolean | null"
  executed: boolean
  transaction_hash: "string | null"
  error: "string | null"
