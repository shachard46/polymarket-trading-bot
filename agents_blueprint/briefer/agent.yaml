id: briefer
description: Crux Architect — turns the scout's landscape into 5-8 role-assigned research questions (cruxes) with queries (price-blind).
model: null
tools:
  allow: []
input_schema:
  market_id: string
  title: string
  description: string
  resolution_source: "string | null"
  end_date: "string | null"
  category: "string | null"
  today: string
  depth: string
  scout: "dict | null"
output_schema:
  market_id: string
  cruxes: list[dict]
  error: "string | null"
