id: overseer
description: Macro-learner; makes small, bounded edits to active_directives.md from stats, failure classes and post-mortems.
model: null
tools:
  allow: []
input_schema:
  post_mortems: list[dict]
  current_directives: string
  stats_md: string
  failure_class_counts: dict
  bounds: list[dict]
output_schema:
  new_directives_markdown: string
  rationale: string
  error: "string | null"
live_response_hint: |
  Do NOT include market_id, passed, signal_bundle, or per-market decision fields.
  new_directives_markdown must be the complete active_directives.md replacement:
  YAML frontmatter (--- ... ---) then body with these level-2 headers verbatim:
  ## Research Protocol, ## Filter Weightings, ## Risk Constraints, ## Output Requirements (in this order).
  ## Filter Weightings MUST contain a fenced ```yaml block with a `filters:` mapping of ONLY the knobs listed in `bounds` (change at most 2, each by at most max_step_frac, never a locked one; cite the stat that justifies each change in rationale).
  Put Markdown inside the JSON string (escape newlines as \n).
