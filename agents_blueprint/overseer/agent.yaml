id: overseer
openclaw_agent_id: polymarket-overseer
description: Macro-learner; rewrites active_directives.md from post-mortem batch.
model: null
tools:
  allow: []
input_schema:
  post_mortems: list[dict]
  current_directives: string
output_schema:
  new_directives_markdown: string
  rationale: string
  error: "string | null"
live_response_hint: |
  Do NOT include market_id, passed, signal_bundle, or per-market decision fields.
  new_directives_markdown must be the complete active_directives.md replacement:
  YAML frontmatter (--- ... ---) then body with these level-2 headers verbatim:
  ## Research Protocol, ## Filter Weightings, ## Risk Constraints, ## Output Requirements.
  Put Markdown inside the JSON string (escape newlines as \n).
