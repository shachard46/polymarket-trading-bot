# LLM prices in USD per 1M tokens, per provider and model. The USER maintains this file.
# No prices are shipped: a model missing here gets cost_usd null and stats say "price missing for <model>".
# Keys under a provider must match the model id exactly as it appears in config/models.yaml.
#
# batch_discount multiplies the cost of batch calls (default 0.5).
batch_discount: 0.5

providers:
  gemini:
    gemini-4-hydrogen: {input: 1.50, output: 7.50}
    gemini-3.5-flash-lite: {input: 0.30, output: 2.50}
  openrouter:
    deepseek/deepseek-v4.1-flash: {input: 0.0507, output: 0.2028}   # OpenRouter public /models, 2026-11-19
#  anthropic:
#    some-model-id: {input: 0.0, output: 0.0}
#  gemini:
#    another-model-id: {input: 0.0, output: 0.0}
#  openrouter:
#    vendor/model-id: {input: 0.0, output: 0.0}
